services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: impromptu_bootstrap
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username impromptu_bootstrap --dbname postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../migrations:/workspace/infra/migrations:ro
      - ./migrate.sh:/workspace/infra/database/migrate.sh:ro
      - ../../tests/database:/workspace/tests/database:ro
