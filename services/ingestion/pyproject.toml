[project]
name = "impromptu-ingestion"
version = "0.1.0"
description = "Server and local-admin structural deck ingestion worker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-pptx>=1.0,<2",
]

[project.scripts]
impromptu-ingestion = "impromptu_ingestion.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
